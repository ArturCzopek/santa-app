<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santa App – nowa wersja</title>
  <meta http-equiv="refresh" content="0; url=https://arturczopek.github.io/santa-app-v2/">
  <link rel="canonical" href="https://arturczopek.github.io/santa-app-v2/">
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #37474f;
      background: linear-gradient(135deg, #e0f7fa, #4fc3f7);
    }

    main {
      width: min(100%, 650px);
      padding: 40px;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
      text-align: center;
    }

    h1 { margin: 0 0 20px; color: #0277bd; }
    p { margin: 0 0 20px; font-size: 18px; line-height: 1.6; }
    p:last-child { margin-bottom: 0; }
    a { color: #01579b; font-weight: bold; }
    a:focus-visible { outline: 3px solid #01579b; outline-offset: 4px; }

    @media (max-width: 768px) {
      main { padding: 30px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Santa App ma nową wersję</h1>
    <p>Przenosimy Cię do aktualnej aplikacji.</p>
    <p><a href="https://arturczopek.github.io/santa-app-v2/">Przejdź do Santa App v2</a></p>
  </main>
</body>
</html>
